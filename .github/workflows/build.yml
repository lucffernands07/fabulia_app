name: Build APK and Deploy Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-key:
    name: Generate Secure Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Keystore & Print Secure Output
        env:
          KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'FabuliaKey2026Secure!' }}
        run: |
          echo "::add-mask::$KEY_PASS"
          keytool -genkeypair -v -keystore release.jks -alias fabulia -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEY_PASS" -keypass "$KEY_PASS" -dname "CN=Fabulia, O=Fabulia, C=BR"
          
          echo "--- COPIE O SHA1 ABAIXO PARA O GOOGLE CLOUD ---"
          keytool -list -v -keystore release.jks -alias fabulia -storepass "$KEY_PASS" | grep "SHA1:"
          echo "-----------------------------------------------"
          
          echo "--- COPIE O BASE64 ABAIXO PARA A SECRET ANDROID_KEYSTORE_BASE64 ---"
          base64 -w 0 release.jks
          echo ""
          echo "-------------------------------------------------------------------"
          
